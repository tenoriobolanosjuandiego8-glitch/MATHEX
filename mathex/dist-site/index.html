const DUEL = { width: 960, height: 360, floor: 292 }
function pixelRect(ctx, x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h) }

  }

}
function drawBattle(ctx, b, now) {

  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#101b42'); sky.addColorStop(.65, '#17183c'); sky.addColorStop(1, '#090f23'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H)
  // estrellas y edificios pixelados
  for (let i = 0; i < 48; i++) { const x = (i * 193 + 31) % W, y = (i * 47 + 19) % 180; pixelRect(ctx, x, y, i % 4 === 0 ? 3 : 2, 2, i % 3 ? '#7187c8' : '#56eaff') }
  for (let i = 0; i < 15; i++) { const x = i * 68, h = 55 + ((i * 37) % 85); pixelRect(ctx, x, floor - h, 54, h, '#111b3a'); for (let wy = floor - h + 12; wy < floor - 8; wy += 17) for (let wx = x + 9; wx < x + 48; wx += 16) pixelRect(ctx, wx, wy, 5, 7, (i + wx + wy) % 3 ? '#29466d' : '#4c3677') }

function duelAttack(i, now) {

  b.cooldown[i] = now + (p.weapon === 'blaster' ? 720 : 620)

    typeof o.id === 'string' && typeof o.finishedAt === 'string' && Array.isArray(o.players) && o.players.length === 2 &&
    o.players.every(okPlayer) && (o.winner === 0 || o.winner === 1 || o.winner === 'draw') &&
    typeof o.rounds === 'number' && Array.isArray(o.moduleIds)
  )
}

/** Lee el historial; si los datos están corruptos devuelve lo válido en vez de romper el juego. */
function loadHistory(storage                 )                 {
  try {
    const raw = storage.getItem(HISTORY_KEY)
    if (!raw) return []
    const data          = JSON.parse(raw)
    return Array.isArray(data) ? data.filter(isSummary) : []
  } catch {
    return []
  }
}

/** Guarda la partida (la más reciente primero). Evita duplicados por id. */
function saveMatch(storage                 , summary              )                 {
  const history = [summary, ...loadHistory(storage).filter((m) => m.id !== summary.id)].slice(0, MAX_HISTORY)
  storage.setItem(HISTORY_KEY, JSON.stringify(history))
  return history
}

                          
                      
                                                   
                                      
               
 

function computeRecords(history                )          {
  const rec          = { totalMatches: history.length, bestScore: null, winsByPlayer: {}, draws: 0 }
  for (const m of history) {
    for (const p of m.players) if (!rec.bestScore || p.score > rec.bestScore.score) rec.bestScore = { name: p.name, score: p.score }
    if (m.winner === 'draw') rec.draws++
    else {
      const name = m.players[m.winner].name
      rec.winsByPlayer[name] = (rec.winsByPlayer[name] ?? 0) + 1
    }
  }
  return rec
}

return { HISTORY_KEY, MAX_HISTORY, summarizeMatch, loadHistory, saveMatch, computeRecords }
